name: UI release checks

on:
  pull_request:
  push:
    branches: [main, feature/dark-navy-interface]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npx tsc --noEmit
      - run: node --check server/index.js
